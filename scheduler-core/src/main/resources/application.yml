# 应用配置
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/lite_scheduler?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: root
    password: 256430
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Lite-Scheduler 配置
lite-scheduler:
  executor:
    pool-size: 10
    scheduler-pool-size: 5
    thread-name-prefix: "lite-scheduler-"
  persistence:
    type: database  # database 或 memory

# 日志配置
logging:
  level:
    # 调整Spring JDBC相关日志级别，减少不必要的调试日志
    org.springframework.jdbc: INFO
    # 调整MyBatis相关日志级别，只在必要时输出SQL日志
    com.tuba.schedulercore.mapper: INFO
    # 调整Lite-Scheduler自身的日志级别
    com.tuba.schedulercore: INFO
