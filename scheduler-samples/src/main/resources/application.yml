spring:
  datasource:
    url: jdbc:mysql://localhost:3306/lite_scheduler?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: 256430
    driver-class-name: com.mysql.cj.jdbc.Driver
  jdbc:
    template:
      query-timeout: 30
  sql:
    init:
      mode: never
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.sql.init.SqlInitializationAutoConfiguration

# 日志配置
logging:
  level:
    com.tuba: DEBUG
    org.springframework: INFO
    org.springframework.jdbc: DEBUG
# 应用配置
server:
  port: 8082
  servlet:
    context-path: /

# 任务调度器配置
lite-scheduler:
  executor:
    pool-size: 10
    scheduler-pool-size: 5
    thread-name-prefix: lite-scheduler-
  persistence:
    type: database  # database 或 memory